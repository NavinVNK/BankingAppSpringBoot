spring:
  application:
    name: banking-app

  datasource:
    url: jdbc:mysql://localhost:3306/banking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
  

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update # Automatically creates/updates tables (use 'validate' or Flyway/Liquibase in production)
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  web:
    error:
      include-message: always

# Enable RFC 7807 support for exception handling